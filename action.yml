name: Setup Koja
description: Install the Koja compiler toolchain and add it to PATH
author: koja-lang

branding:
  icon: download
  color: green

inputs:
  koja-version:
    description: >-
      Koja version to install: exact (major.minor.patch), partial
      (major.minor), or "latest". Empty means latest unless
      koja-version-file is set.
    required: false
    default: ""
  koja-version-file:
    description: >-
      Path to a file that names the Koja version. Supports
      .tool-versions (asdf format) and koja.toml (the [project] koja
      minimum version).
    required: false
    default: ""
  token:
    description: >-
      No longer used. Versions resolve through releases.kojalang.org
      without a token. Kept so existing workflows keep working.
    required: false
    default: ""

outputs:
  koja-version:
    description: The resolved Koja version that was installed.
    value: ${{ steps.install.outputs.koja-version }}
  koja-path:
    description: Directory the toolchain was installed into.
    value: ${{ steps.install.outputs.koja-path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        KOJA_VERSION_INPUT: ${{ inputs.koja-version }}
        KOJA_VERSION_FILE: ${{ inputs.koja-version-file }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install.sh"

    - name: Register problem matcher
      shell: bash
      run: echo "::add-matcher::${GITHUB_ACTION_PATH}/problem-matcher.json"
